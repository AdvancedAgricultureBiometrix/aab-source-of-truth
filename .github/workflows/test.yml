name: Test
# Pull requests run the suite once; main runs it again after every merge.
# (push on every branch as well would run it twice for each push to a PR.)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: scs-pilot/packages/api
      - run: npm test
        working-directory: scs-pilot/packages/api
        env:
          SCS_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scs_test
