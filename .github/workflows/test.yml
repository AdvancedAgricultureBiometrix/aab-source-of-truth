name: Test
# Pull requests run the suite once; main runs it again after every merge.
# (push on every branch as well would run it twice for each push to a PR.)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      # SeaweedFS (S3-compatible) for the evidence object store tests, pinned
      # to a release tag, the same as docker-compose.yml. Started as a step,
      # not a service container: a service cannot be given a command. The S3
      # identity is a throwaway one for this job.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 --entrypoint sh chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 -c \
            'printf "{\"identities\":[{\"name\":\"scs-ci\",\"credentials\":[{\"accessKey\":\"scs-ci\",\"secretKey\":\"scs-ci-secret-key\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=64'
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8333/healthz && exit 0
            sleep 2
          done
          echo "SeaweedFS did not become healthy" >&2
          docker logs seaweedfs >&2
          exit 1
      # The api image (packages/api/Dockerfile) must build cleanly: the stack
      # runs it, so a broken Dockerfile is caught here, not at the next
      # docker compose up --build. It is only built, not run.
      - name: Build the api image
        run: docker build -f scs-pilot/packages/api/Dockerfile -t scs-pilot-api:ci scs-pilot/packages
      - run: npm ci
        working-directory: scs-pilot/packages/api
      - run: npm test
        working-directory: scs-pilot/packages/api
        env:
          SCS_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scs_test
          SCS_TEST_S3_ENDPOINT: http://localhost:8333
          SCS_TEST_S3_ACCESS_KEY_ID: scs-ci
          SCS_TEST_S3_SECRET_ACCESS_KEY: scs-ci-secret-key

  # The access isolation proof's network checks, on the real stack: build it
  # from docker-compose.yml, verify the country isolation model (only the API
  # reachable from the host; api, postgres and seaweedfs with no route
  # outside), then add docker-compose.dev.yml and verify again. Every secret
  # is a throwaway generated for this run.
  isolation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scs-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Throwaway .env and actors file
        run: |
          r() { openssl rand -hex 24; }
          {
            echo "POSTGRES_DB=scs_pilot"
            echo "POSTGRES_USER=scs_owner"
            echo "POSTGRES_PASSWORD=$(r)"
            echo "POSTGRES_PORT=55433"
            echo "SCS_API_DB_PASSWORD=$(r)"
            echo "S3_ACCESS_KEY_ID=$(r)"
            echo "S3_SECRET_ACCESS_KEY=$(r)"
            echo "S3_PORT=9000"
            echo "S3_BUCKET=scs-evidence"
            echo "API_PORT=3000"
          } > .env
          digest=$(r | tr -d '\n' | sha256sum | cut -d' ' -f1)
          sed "s/REPLACE_WITH_SHA256_OF_A_RANDOM_TOKEN_OF_AT_LEAST_32_CHARACTERS/$digest/" packages/api/config/static-actors.example.json > packages/api/config/static-actors.json
      - name: Country stack (docker-compose.yml) — verify isolation
        run: |
          docker compose up -d --build --wait
          POSTGRES_PORT=55433 node isolation/verify-network-isolation.mjs base
      - name: With docker-compose.dev.yml — verify isolation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
          POSTGRES_PORT=55433 node isolation/verify-network-isolation.mjs dev
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Remove the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  # The backup and restore proof: the whole procedure on throwaway
  # environments (scs-pilot/backup/prove-backup-restore.mjs). A governed chain
  # is created through the API, backed up, restored into a fresh environment
  # with no volumes, and verified: migrations and checksums, receipts,
  # packages, files, row counts, grants, and the restored API itself. It also
  # checks that a tampered backup and a restore over an existing environment
  # are refused.
  backup-restore:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scs-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Prove backup and restore
        run: node backup/prove-backup-restore.mjs
