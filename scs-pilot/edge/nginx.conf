# SCS pilot edge — the only container with a published port and the only one
# with a route outside the stack's internal network (docker-compose.yml).
#
# It forwards plain TCP from the host's loopback to the API, and nothing else.
# It holds no data and no credentials, terminates nothing, inspects nothing:
# the API's own authentication applies to every request. Names are resolved
# per connection through Docker's internal DNS (127.0.0.11), so a restarted
# API container is found again without restarting the edge.
#
# docker-compose.dev.yml replaces this file with nginx.dev.conf, which also
# forwards PostgreSQL and the object store for the tests on the host.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format edge '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time $upstream_addr';
  access_log /dev/stdout edge;

  # the API (published on the host as 127.0.0.1:${API_PORT})
  server {
    listen 3000;
    set $api api:3000;
    proxy_pass $api;
  }
}
