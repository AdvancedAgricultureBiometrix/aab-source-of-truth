# SCS pilot edge, development — used only with docker-compose.dev.yml.
#
# The same as nginx.conf, plus PostgreSQL and the object store, so the
# integration tests on the host can reach them (127.0.0.1 only). A country
# deployment uses nginx.conf: its database and object store are never
# reachable from outside the internal network.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format edge '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time $upstream_addr';
  access_log /dev/stdout edge;

  # the API (host 127.0.0.1:${API_PORT})
  server {
    listen 3000;
    set $api api:3000;
    proxy_pass $api;
  }

  # development only: PostgreSQL (host 127.0.0.1:${POSTGRES_PORT})
  server {
    listen 5432;
    set $postgres postgres:5432;
    proxy_pass $postgres;
  }

  # development only: the object store's S3 endpoint (host 127.0.0.1:${S3_PORT})
  server {
    listen 8333;
    set $seaweedfs seaweedfs:8333;
    proxy_pass $seaweedfs;
  }
}
