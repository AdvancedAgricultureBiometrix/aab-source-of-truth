# SCS pilot — development override: PostgreSQL and the object store reachable
# from the host, for the integration tests (127.0.0.1 only).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The services themselves stay on the internal network, with no route outside:
# the edge container forwards two more ports to them (edge/nginx.dev.conf). A
# country deployment runs docker-compose.yml alone, where only the API is
# reachable from the host.

services:
  # Optional test identities for the scoped-store tests on the host
  # (packages/api/src/integration/scoped-store-harness.ts), scoped to scs-idt-*
  # buckets only. Set SCS_TEST_S3_API_* and SCS_TEST_S3_BACKUP_* in .env to add
  # them, and SCS_TEST_S3_API_IDENTITY=scs-test-api for the tests. The country
  # stack, docker-compose.yml alone, never has them.
  seaweedfs:
    environment:
      SCS_TEST_S3_API_ACCESS_KEY_ID: ${SCS_TEST_S3_API_ACCESS_KEY_ID:-}
      SCS_TEST_S3_API_SECRET_ACCESS_KEY: ${SCS_TEST_S3_API_SECRET_ACCESS_KEY:-}
      SCS_TEST_S3_BACKUP_ACCESS_KEY_ID: ${SCS_TEST_S3_BACKUP_ACCESS_KEY_ID:-}
      SCS_TEST_S3_BACKUP_SECRET_ACCESS_KEY: ${SCS_TEST_S3_BACKUP_SECRET_ACCESS_KEY:-}

  edge:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - ./edge/nginx.dev.conf:/etc/nginx/nginx.conf:ro
