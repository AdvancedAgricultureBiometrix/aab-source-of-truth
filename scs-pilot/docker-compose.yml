# SCS pilot — local development stack (scaffold)
#
#   cp .env.example .env      # then fill in local-only values
#   docker compose up -d
#
# postgres  — the database; holds no migration logic of its own
# migrate   — runs on every start, before the api: applies any pending
#             packages/db/migrations/*.sql in order as the owner role, records
#             each one (scs_migration.applied_migration), then sets the scs_api
#             password from SCS_API_DB_PASSWORD. Idempotent; exits non-zero on
#             any failure, and the api does not start (src/migrations/runner.ts)
# seaweedfs — S3-compatible object storage: the evidence object store
#             (SCS-PLATFORM-01). The api stores evidence files there under
#             their SHA-256, never overwriting (conditional PUT, If-None-Match);
#             it creates the bucket at startup. Pinned to a release tag: an
#             unpinned "latest" image is how the MinIO image broke. Its S3
#             identity file is written from .env at container start, so no
#             credentials are committed
# api       — Node service; connects as the restricted role scs_api only and
#             refuses to start if that role owns scs objects, is a superuser
#             or can bypass row-level security
#
# Roles: POSTGRES_USER owns the database and runs migrations (the migrate
#        service); the api uses scs_api (migration 004: SELECT + INSERT only,
#        row-level security).
#
# A volume built before the migration runner (by the old first-start init
# hook) has SCS objects but no migration history; migrate refuses it until it
# is baselined once:  docker compose run --rm migrate npm run migrate -- --baseline 011

name: scs-pilot

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run migrate"
    restart: "no"
    environment:
      # the owner (migration) role — never scs_api
      SCS_MIGRATE_DB_HOST: postgres
      SCS_MIGRATE_DB_PORT: 5432
      SCS_MIGRATE_DB_NAME: ${POSTGRES_DB}
      SCS_MIGRATE_DB_USER: ${POSTGRES_USER}
      SCS_MIGRATE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SCS_API_DB_PASSWORD: ${SCS_API_DB_PASSWORD:?set SCS_API_DB_PASSWORD in .env}
      SCS_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./packages/api:/app
      - api-node-modules:/app/node_modules
      - ./packages/db/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"scs-api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3000}
      SCS_DB_HOST: postgres
      SCS_DB_PORT: 5432
      SCS_DB_NAME: ${POSTGRES_DB}
      SCS_DB_USER: scs_api
      SCS_DB_PASSWORD: ${SCS_API_DB_PASSWORD}
      SCS_AUTH_STATIC_ACTORS_FILE: /app/config/static-actors.json
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-scs-evidence}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - ./packages/api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  api-node-modules:
