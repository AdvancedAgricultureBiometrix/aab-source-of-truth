# SCS pilot — local development stack (scaffold)
#
#   cp .env.example .env      # then fill in local-only values
#   docker compose up -d --build
#
# The api and migrate services run the image built from packages/api/Dockerfile
# (scs-pilot-api:local): dependencies installed and TypeScript compiled at build
# time, nothing installed or fetched at start. After changing api code or a
# migration, rebuild: docker compose up -d --build
#
# Networks (the access isolation model for this platform):
#   internal — internal: true. postgres, seaweedfs, migrate and api are on it
#              and on nothing else: they reach each other, but no public
#              address, no public DNS and no service on the host
#              (host.docker.internal). On Docker Desktop an internal network is
#              the only setting that blocks a container's outbound traffic.
#   edge     — an ordinary network. Only the edge container is on it, and on
#              internal: it is the one container with a route outside, and it
#              publishes the only host port (127.0.0.1:${API_PORT}, the API).
#              It forwards TCP and holds no data and no credentials.
# A container on an internal-only network cannot publish a port, which is why
# the edge container exists. For the tests on the host, docker-compose.dev.yml
# also forwards PostgreSQL and the object store through the edge:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# postgres  — the database; holds no migration logic of its own
# migrate   — runs on every start, before the api: applies any pending
#             packages/db/migrations/*.sql in order as the owner role, records
#             each one (scs_migration.applied_migration), then sets the scs_api
#             password from SCS_API_DB_PASSWORD. Idempotent; exits non-zero on
#             any failure, and the api does not start (src/migrations/runner.ts)
# seaweedfs — S3-compatible object storage: the evidence object store
#             (SCS-PLATFORM-01). The api stores evidence files there under
#             their SHA-256, never overwriting (conditional PUT, If-None-Match);
#             it creates the bucket at startup. Pinned to a release tag: an
#             unpinned "latest" image is how the MinIO image broke. Its S3
#             identity file is written from .env at container start, so no
#             credentials are committed
# api       — Node service; connects as the restricted role scs_api only and
#             refuses to start if that role owns scs objects, is a superuser
#             or can bypass row-level security
# edge      — nginx, TCP forwarding only (edge/nginx.conf): the host's
#             127.0.0.1:${API_PORT} to api:3000. Read-only filesystem
#
# Roles: POSTGRES_USER owns the database and runs migrations (the migrate
#        service); the api uses scs_api (migration 004: SELECT + INSERT only,
#        row-level security).
#
# A volume built before the migration runner (by the old first-start init
# hook) has SCS objects but no migration history; migrate refuses it until it
# is baselined once:  docker compose run --rm migrate node dist/migrations/cli.js --baseline 011

name: scs-pilot

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [internal]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./packages
      dockerfile: api/Dockerfile
    image: scs-pilot-api:local
    command: ["node", "dist/migrations/cli.js"]
    restart: "no"
    # a one-off command, not the API: the image's HEALTHCHECK does not apply
    healthcheck:
      disable: true
    networks: [internal]
    environment:
      # the owner (migration) role — never scs_api
      SCS_MIGRATE_DB_HOST: postgres
      SCS_MIGRATE_DB_PORT: 5432
      SCS_MIGRATE_DB_NAME: ${POSTGRES_DB}
      SCS_MIGRATE_DB_USER: ${POSTGRES_USER}
      SCS_MIGRATE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SCS_API_DB_PASSWORD: ${SCS_API_DB_PASSWORD:?set SCS_API_DB_PASSWORD in .env}
      # the migrations built into the image
      SCS_MIGRATIONS_DIR: /db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"scs-api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=64
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    networks: [internal]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./packages
      dockerfile: api/Dockerfile
    image: scs-pilot-api:local
    networks: [internal]
    environment:
      # inside the internal network the API always listens on 3000; the host
      # port (API_PORT) is published by the edge
      API_PORT: 3000
      SCS_DB_HOST: postgres
      SCS_DB_PORT: 5432
      SCS_DB_NAME: ${POSTGRES_DB}
      SCS_DB_USER: scs_api
      SCS_DB_PASSWORD: ${SCS_API_DB_PASSWORD}
      SCS_AUTH_STATIC_ACTORS_FILE: /app/config/static-actors.json
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-scs-evidence}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      # token digests: supplied at run time, never built into the image
      - ./packages/api/config/static-actors.json:/app/config/static-actors.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  edge:
    image: nginx:1.30.5-alpine3.24@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    # it holds nothing: the filesystem is read-only, with scratch space in memory
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      api:
        condition: service_healthy

# TODO(tenant-network-policy): these networks isolate the services from the
# outside, not one environment from another on the same host. The edge
# container has a route outside, so two environments on one host, each with
# this architecture, can still reach each other through the host's
# network-facing interfaces (and, on Docker Desktop, the host's loopback
# through host.docker.internal). Cross-environment isolation on a shared host
# needs infrastructure-level network policy, which Docker Compose cannot
# provide: separate hosts, or host firewall / kernel-level network policy.
# Not fixed here; disclosed.
networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres-data:
  seaweedfs-data:
